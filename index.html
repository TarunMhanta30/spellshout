<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spellshout — Mic Test</title>
    <style>
      :root {
        --bg: #14121f;
        --panel: #1e1b2e;
        --ink: #e9e4ff;
        --muted: #9a92c7;
        --accent: #7c6cff;
        --meter: #58e39b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 32px 16px 48px;
      }
      h1 { font-size: 24px; letter-spacing: 2px; margin: 0; }
      .sub { color: var(--muted); font-size: 13px; margin: -16px 0 0; }
      button {
        font: inherit;
        font-size: 18px;
        padding: 14px 32px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        transition: filter 0.15s, opacity 0.15s;
      }
      button:hover { filter: brightness(1.1); }
      button:disabled { opacity: 0.5; cursor: default; }
      .status { color: var(--muted); font-size: 14px; min-height: 18px; }
      .meter-wrap {
        width: min(700px, 100%);
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
      }
      .meter-label {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .meter-track {
        height: 28px;
        background: #0f0d18;
        border-radius: 8px;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--meter), #d7e358);
        transition: width 0.06s linear;
      }
      .transcript {
        width: min(700px, 100%);
        min-height: 180px;
        background: var(--panel);
        border-radius: 12px;
        padding: 24px;
        font-size: 34px;
        line-height: 1.3;
        word-break: break-word;
      }
      .transcript .interim { color: var(--muted); }
      .transcript .placeholder { color: var(--muted); font-size: 20px; }
    </style>
  </head>
  <body>
    <h1>SPELLSHOUT · MIC TEST</h1>
    <p class="sub">Milestone 1 — speech recognition + live volume, running together</p>

    <button id="start">Start</button>
    <div class="status" id="status">Click Start and allow microphone access.</div>

    <div class="meter-wrap">
      <div class="meter-label"><span>Microphone volume</span><span id="volPct">0%</span></div>
      <div class="meter-track"><div class="meter-fill" id="meter"></div></div>
    </div>

    <div class="transcript" id="transcript">
      <span class="placeholder">Your words will appear here…</span>
    </div>

    <script type="module" src="/src/mic-test.ts"></script>
  </body>
</html>
